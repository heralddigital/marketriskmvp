<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Before and after cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F4EE"/>
      <stop offset="1" stop-color="#DCDEC5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="120" y="160" width="460" height="480" rx="28" fill="#ffffff" stroke="rgba(11,15,12,0.08)" stroke-width="6"/>
  <rect x="620" y="160" width="460" height="480" rx="28" fill="#ffffff" stroke="rgba(11,15,12,0.08)" stroke-width="6"/>

  <!-- Left: noisy -->
  <g transform="translate(160 220)">
    <rect width="380" height="54" rx="14" fill="rgba(11,15,12,0.06)"/>
    <rect x="16" y="17" width="140" height="20" rx="10" fill="rgba(11,15,12,0.28)"/>
    <g transform="translate(0 90)" opacity="0.65">
      <path d="M10 200 L80 130 L140 160 L210 90 L290 140 L360 70" fill="none" stroke="rgba(11,15,12,0.35)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 70 L70 110 L140 90 L210 140 L290 100 L360 150" fill="none" stroke="rgba(11,15,12,0.22)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 150 L80 180 L140 120 L210 210 L290 170 L360 230" fill="none" stroke="rgba(11,15,12,0.18)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Right: calm -->
  <g transform="translate(660 220)">
    <rect width="380" height="54" rx="14" fill="rgba(47,82,50,0.10)"/>
    <rect x="16" y="17" width="170" height="20" rx="10" fill="#2F5232" opacity="0.85"/>
    <g transform="translate(0 90)">
      <path d="M12 210 L90 160 L180 175 L270 120 L360 150" fill="none" stroke="#2F5232" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 210 L90 190 L180 205 L270 180 L360 200" fill="none" stroke="#8ACA74" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      <circle cx="90" cy="160" r="12" fill="#2F5232"/>
      <circle cx="270" cy="120" r="12" fill="#2F5232"/>
    </g>
  </g>

  <!-- Divider hint -->
  <path d="M600 170 V 630" stroke="rgba(11,15,12,0.10)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 14"/>
</svg>

